name: fetch-images
on:
  push:
    paths: ['.github/workflows/fetch.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images
        run: |
          mkdir -p fccp/v3
          curl -fsSL -o fccp/v3/badge_appstore.png https://backend.composio.dev/api/v3/sl/vMUCi2Te9D
          curl -fsSL -o fccp/v3/badge_googleplay.png https://backend.composio.dev/api/v3/sl/c4x5RV4iA0
          file fccp/v3/*.png
      - name: Commit
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add fccp
          git commit -m 'Add FCCP store badge images' || echo 'nothing to commit'
          git push
